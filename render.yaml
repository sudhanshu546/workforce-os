services:
  # 1. Main Application (Backend + Bundled Frontend)
  - type: web
    name: workforce-app
    env: docker
    dockerfilePath: Dockerfile
    plan: free # Change to starter or higher for production
    envVars:
      - key: VITE_API_BASE_URL
        value: /api/v1
      - key: VITE_RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: DATABASE_URL # Must be prefixed with jdbc: (e.g., jdbc:postgresql://...)
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: REDIS_HOST
        fromService:
          type: redis
          name: workforce-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: workforce-redis
          property: port
      - key: REDIS_PASSWORD
        fromService:
          type: redis
          name: workforce-redis
          property: password
      - key: SPRING_RABBITMQ_HOST
        fromService:
          type: private
          name: workforce-rabbitmq
          property: host
      - key: SPRING_RABBITMQ_PORT
        value: 5672
      - key: SPRING_RABBITMQ_USERNAME
        value: guest
      - key: SPRING_RABBITMQ_PASSWORD
        sync: false # Set this manually in Render Dashboard for security
      - key: JWT_SECRET
        generateValue: true
      - key: MESSAGING_PROVIDER
        value: GUPSHUP
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: GUPSHUP_CLIENT_ID
        sync: false
      - key: GUPSHUP_CLIENT_SECRET
        sync: false
      - key: GUPSHUP_APP_ID
        sync: false
      - key: AWS_ACCESS_KEY
        sync: false
      - key: AWS_SECRET_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_FROM_EMAIL
        sync: false
      - key: STORAGE_TYPE
        value: LOCAL # Change to S3 once bucket is created
      - key: AWS_S3_BUCKET_NAME
        sync: false
      - key: APPLICATION_BASE_URL
        value: https://workforce-app.onrender.com # Update this with your actual Render URL

  # 2. RabbitMQ (Private Service)
  - type: private
    name: workforce-rabbitmq
    env: docker
    dockerContext: .
    dockerfilePath: Dockerfile.rabbitmq
    plan: starter # Requires at least starter plan for Private Services
    disk:
      name: rabbitmq-data
      mountPath: /var/lib/rabbitmq
      sizeGB: 1

# Redis is a first-class citizen in Render
redis:
  - name: workforce-redis
    plan: free
    ipAllowList: [] # Only allow internal traffic
