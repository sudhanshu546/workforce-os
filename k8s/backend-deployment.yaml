apiVersion: apps/v1
kind: Deployment
metadata:
  name: workforce-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: workforce-backend
  template:
    metadata:
      labels:
        app: workforce-backend
    spec:
      containers:
      - name: backend
        image: workforce-os-backend:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        env:
        - name: DATABASE_URL
          value: "jdbc:postgresql://postgres-service:5432/workforce_os"
        - name: REDIS_HOST
          value: "redis-service"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: workforce-backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: workforce-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
