<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Invoice</title>
    <style>
        body { font-family: sans-serif; padding: 40px; }
        .header { border-bottom: 2px solid #333; padding-bottom: 20px; }
        .invoice-table { width: 100%; border-collapse: collapse; margin-top: 30px; }
        .invoice-table th, .invoice-table td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        .total { font-weight: bold; font-size: 1.2em; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Invoice</h1>
        <p>Invoice #: <span th:text="${invoice.invoiceNumber}"></span></p>
        <p>Date: <span th:text="${#temporals.format(invoice.createdAt, 'dd-MM-yyyy')}"></span></p>
    </div>
    
    <h3>Client: <span th:text="${invoice.workOrder.customer.name}"></span></h3>
    
    <table class="invoice-table">
        <thead>
            <tr>
                <th>Description</th>
                <th>Amount</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="item : ${invoice.workOrder.quotation.items}">
                <td th:text="${item.description}"></td>
                <td th:text="'₹' + ${#numbers.formatDecimal(item.totalAmount, 1, 2)}"></td>
            </tr>
        </tbody>
    </table>
    
    <p>Subtotal: ₹<span th:text="${#numbers.formatDecimal(invoice.subtotal, 1, 2)}"></span></p>
    <p>Tax: ₹<span th:text="${#numbers.formatDecimal(invoice.tax, 1, 2)}"></span></p>
    <p class="total">Total: ₹<span th:text="${#numbers.formatDecimal(invoice.total, 1, 2)}"></span></p>
</body>
</html>
