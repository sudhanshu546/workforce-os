spring.application.name=workforce-os
server.port=${PORT:8080}
# Database Configuration (Render/Production Ready)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/workforce_os}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT Configuration (Recommended: set as Environment Variable in production)
application.security.jwt.secret-key=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# Expiration: 1 day (86400000 ms)
application.security.jwt.expiration=86400000
# Refresh Token Expiration: 7 days (604800000 ms)
application.security.jwt.refresh-token.expiration=604800000

# Razorpay Configuration
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_default}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:secret_default}

# Financial Configuration
application.finance.tax.default-rate=18.0

