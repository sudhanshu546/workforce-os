spring.application.name=workforce-os
server.port=${PORT:8080}
# Database Configuration (Render/Production Ready)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/workforce_os}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Performance Tuning for PgBouncer (Transaction Mode)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=WorkforceHikariCP
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# Resilience and Hibernate Settings
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT Configuration (Recommended: set as Environment Variable in production)
application.security.jwt.secret-key=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# Expiration: 1 day (86400000 ms)
application.security.jwt.expiration= 86400000
# Refresh Token Expiration: 7 days (604800000 ms)
application.security.jwt.refresh-token.expiration= 604800000

# Razorpay Configuration
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_Sr4dlYjcYXEaAS}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:xVkNxqlZ9CDgUu7gBSxwijZt}

# Financial Configuration
application.finance.tax.default-rate=18.0

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000
spring.cache.redis.cache-null-values=false

# RabbitMQ Configuration
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${SPRING_RABBITMQ_VIRTUAL_HOST:/}
spring.rabbitmq.ssl.enabled=${SPRING_RABBITMQ_SSL:false}
spring.rabbitmq.connection-timeout=5000

# Messaging Configuration
application.messaging.provider=${MESSAGING_PROVIDER:NONE}
application.messaging.email-provider=${EMAIL_PROVIDER:NONE}
application.messaging.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
application.messaging.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
application.messaging.twilio.from-number=${TWILIO_FROM_NUMBER:}

# Gupshup Configuration
application.messaging.gupshup.client-id=${GUPSHUP_CLIENT_ID:c3VkaGFuc2h1c2Fpbmk1NDZAZ21haWwuY29t}
application.messaging.gupshup.client-secret=${GUPSHUP_CLIENT_SECRET:G187b7Fi7XVcaKm9wVv3leVGd1t7ZbTM}
application.messaging.gupshup.app-id=${GUPSHUP_APP_ID:NA_vr78bAkl}

# AWS SES Configuration
application.messaging.aws.access-key=${AWS_ACCESS_KEY:}
application.messaging.aws.secret-key=${AWS_SECRET_KEY:}
application.messaging.aws.region=${AWS_REGION:us-east-1}
application.messaging.aws.from-email=${AWS_FROM_EMAIL:}

# AWS S3 Configuration
application.storage.type=${STORAGE_TYPE:LOCAL}
application.storage.aws.bucket-name=${AWS_S3_BUCKET_NAME:}

# Application Base URL (for tracking links)
application.base-url=${APPLICATION_BASE_URL:http://localhost:5173}

# Monitoring & Actuator Configuration
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true

# Render/Proxy Configuration
server.forward-headers-strategy=native

# Logging Configuration
logging.level.root=INFO
logging.level.com.workforce.os=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.amqp=DEBUG
logging.level.com.rabbitmq=DEBUG

# Liquibase Configuration
spring.liquibase.enabled=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# VAPID Configuration for Push Notifications
vapid.public.key=${VAPID_PUBLIC_KEY:BEf5JlGsJxC5n56y8QzKeBnVDXS5wdsRolc4_it4okUaQn64d8ZRH2P0toUGf3dDaDherjRjxv00sm7aOgJFngU}
vapid.private.key=${VAPID_PRIVATE_KEY:3V5_dsXTFcx20nqyWtrC-PrgJo6FzLXHbErpemlH8Qo}
vapid.subject=mailto:sudhanshusaini546@gmail.com

# Resilience4j Configuration for Razorpay
resilience4j.circuitbreaker.instances.razorpayService.register-health-indicator=true
resilience4j.circuitbreaker.instances.razorpayService.sliding-window-size=10
resilience4j.circuitbreaker.instances.razorpayService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.razorpayService.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.razorpayService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.razorpayService.event-consumer-buffer-size=10

resilience4j.retry.instances.razorpayService.max-attempts=3
resilience4j.retry.instances.razorpayService.wait-duration=2s
resilience4j.retry.instances.razorpayService.enable-exponential-backoff=true
resilience4j.retry.instances.razorpayService.exponential-backoff-multiplier=2

